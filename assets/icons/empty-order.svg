<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="80" fill="#F8F7FC" stroke="#E8EDF2" stroke-width="2"/>
  
  <!-- 文档图标 -->
  <rect x="60" y="50" width="80" height="100" rx="8" fill="white" stroke="#D5DDE8" stroke-width="2"/>
  
  <!-- 文档折角 -->
  <path d="M115 50 L140 75 L140 50 Z" fill="#E8EDF2"/>
  
  <!-- 文档线条 -->
  <line x1="75" y1="85" x2="125" y2="85" stroke="#D5DDE8" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="105" x2="115" y2="105" stroke="#D5DDE8" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="125" x2="105" y2="125" stroke="#D5DDE8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 问号 -->
  <circle cx="100" cy="160" r="20" fill="#5B6FE8"/>
  <text x="100" y="168" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">?</text>
</svg>
