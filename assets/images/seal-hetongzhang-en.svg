<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>
  <!-- 外圆 -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#c0392b" stroke-width="4"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <!-- 星 -->
  <polygon points="100,42 107,67 134,67 112,82 120,109 100,94 80,109 88,82 66,67 93,67" fill="#c0392b" filter="url(#shadow)"/>
  <!-- 中英文文字 -->
  <text x="100" y="140" text-anchor="middle" font-family="serif" font-size="16" fill="#c0392b" font-weight="bold">合同专用章</text>
  <text x="100" y="162" text-anchor="middle" font-family="Arial" font-size="10" fill="#c0392b">CONTRACT SEAL</text>
</svg>
